name: Build Alisa IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download SPM dependencies as local sources
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p .deps
          git clone --depth 1 --branch 6.29.0 https://github.com/groue/GRDB.swift.git .deps/GRDB
          git clone --depth 1 --branch 0.9.19 https://github.com/weichsel/ZIPFoundation.git .deps/ZIPFoundation
          git clone --depth 1 --branch 3.5.4 https://github.com/swisspol/GCDWebServer.git .deps/GCDWebServer
          git clone --depth 1 --branch 2.1.0 https://github.com/raspu/Highlightr.git .deps/Highlightr
          rm -rf .deps/GRDB/.git .deps/ZIPFoundation/.git .deps/GCDWebServer/.git .deps/Highlightr/.git

      - name: Generate Xcode Project
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf Alisa.xcodeproj
          xcodegen generate

      - name: Build (Archive)
        run: |
          cd $GITHUB_WORKSPACE
          xcodebuild archive \
            -project Alisa.xcodeproj \
            -scheme Alisa \
            -archivePath build/Alisa.xcarchive \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build/Payload
          cp -r build/Alisa.xcarchive/Products/Applications/Alisa.app build/Payload/
          cd build && zip -r Alisa-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Alisa-Debug
          path: build/Alisa-unsigned.ipa
          compression-level: 0
          if-no-files-found: error
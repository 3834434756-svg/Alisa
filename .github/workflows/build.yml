name: Build Alisa IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    tags:
      - 'v*'

env:
  PROJECT_NAME: Alisa
  SCHEME: Alisa

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf Alisa.xcodeproj Alisa.xcworkspace
          xcodegen generate

      - name: Pre-resolve SPM packages
        run: |
          cd $GITHUB_WORKSPACE
          swift package resolve

      - name: Build (Archive)
        run: |
          cd $GITHUB_WORKSPACE

          # Create workspace with proper package reference
          mkdir -p Alisa.xcworkspace/xcshareddata
          cat > Alisa.xcworkspace/contents.xcworkspacedata << 'XEOF'
<?xml version="1.0" encoding="UTF-8"?>
<Workspace version="1.0">
   <FileRef location="group:Alisa.xcodeproj"/>
   <FileRef location="group:./"/>
</Workspace>
XEOF

          # Create xcshareddata scheme
          mkdir -p Alisa.xcodeproj/xcshareddata/xcschemes
          cat > Alisa.xcodeproj/xcshareddata/xcschemes/Alisa.xcscheme << 'XEOF'
<?xml version="1.0" encoding="UTF-8"?>
<Scheme version="1.0">
   <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
      <BuildActionEntries>
         <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
            <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="Alisa" BuildableName="Alisa.app" BlueprintName="Alisa" ReferencedContainer="container:Alisa.xcodeproj">
            </BuildableReference>
         </BuildActionEntry>
      </BuildActionEntries>
   </BuildAction>
   <ArchiveAction buildConfiguration="Debug" revealArchiveInOrganizer="YES">
   </ArchiveAction>
</Scheme>
XEOF

          xcodebuild archive \
            -workspace Alisa.xcworkspace \
            -scheme Alisa \
            -archivePath build/Alisa.xcarchive \
            -configuration ${{ github.event.inputs.configuration || 'Debug' }} \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        run: |
          cd $GITHUB_WORKSPACE
          xcodebuild archive \
            -workspace Alisa.xcworkspace \
            -scheme Alisa \
            -archivePath build/Alisa.xcarchive \
            -configuration ${{ github.event.inputs.configuration || 'Debug' }} \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build/Payload
          cp -r build/Alisa.xcarchive/Products/Applications/Alisa.app build/Payload/
          cd build && zip -r Alisa-unsigned.ipa Payload
          rm -rf Payload
          echo "IPA_PATH=build/Alisa-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Alisa-${{ github.event.inputs.configuration || 'Debug' }}
          path: ${{ env.IPA_PATH }}
          compression-level: 0
          if-no-files-found: error
name: Alisa
options:
  bundleIdPrefix: com.alisa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: zh-Hans
generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    DEFINES_MODULE: YES
    ENABLE_MODULE_VERIFIER: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Alisa:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Info.plist
    dependencies:
      - target: AlisaCore
      - target: AlisaUI
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.app
        PRODUCT_NAME: Alisa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""

  AlisaCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Core
    dependencies:
      - framework: GRDB.framework
        implicit: true
      - framework: ZIPFoundation.framework
        implicit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.core
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES

  AlisaUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UI
    dependencies:
      - target: AlisaCore
      - framework: Highlightr.framework
        implicit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.ui
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES

  AlisaCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: AlisaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.coretests
        TEST_HOST: ""

  AlisaIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Integration
    dependencies:
      - target: AlisaCore
      - target: AlisaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.integrationtests
        TEST_HOST: ""

  AlisaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Alisa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.uitests
        TEST_TARGET_NAME: Alisa
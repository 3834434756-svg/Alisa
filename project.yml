name: Alisa
options:
  bundleIdPrefix: com.alisa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Alisa:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Info.plist
    dependencies:
      - target: AlisaCore
      - target: AlisaUI
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.app
        PRODUCT_NAME: Alisa
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  GRDB:
    type: framework
    platform: iOS
    sources:
      - path: .deps/GRDB/Sources/GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.grdb
        SKIP_INSTALL: YES

  ZIPFoundation:
    type: framework
    platform: iOS
    sources:
      - path: .deps/ZIPFoundation/Sources/ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.zip
        SKIP_INSTALL: YES

  GCDWebServer:
    type: framework
    platform: iOS
    sources:
      - path: .deps/GCDWebServer/Sources/GCDWebServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.gcd
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/.deps/GCDWebServer/Sources

  Highlightr:
    type: framework
    platform: iOS
    sources:
      - path: .deps/Highlightr/Sources/Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.highlightr
        SKIP_INSTALL: YES

  AlisaCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Core
    dependencies:
      - target: GRDB
      - target: ZIPFoundation
      - target: GCDWebServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.core
        SKIP_INSTALL: YES

  AlisaUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UI
    dependencies:
      - target: AlisaCore
      - target: Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.ui
        SKIP_INSTALL: YES
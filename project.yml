name: Alisa
options:
  bundleIdPrefix: com.alisa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Alisa:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Info.plist
    dependencies:
      - target: AlisaCore
      - target: AlisaUI
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.app
        PRODUCT_NAME: Alisa
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development

  AlisaCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Core
      - path: .deps/GRDB/Sources/GRDB
      - path: .deps/ZIPFoundation/Sources/ZIPFoundation
      - path: .deps/GCDWebServer/GCDWebServer/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.core
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/.deps/GCDWebServer/GCDWebServer/Core

  AlisaUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UI
      - path: .deps/Highlightr/Sources/Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.ui
        SKIP_INSTALL: YES
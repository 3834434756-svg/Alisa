name: Alisa
options:
  bundleIdPrefix: com.alisa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  xcodebuildCommand: /usr/bin/xcodebuild

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  GCDWebServer:
    url: https://github.com/swisspol/GCDWebServer
    from: 3.5.4
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Alisa:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Info.plist
    dependencies:
      - target: AlisaCore
      - target: AlisaUI
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.app
        PRODUCT_NAME: Alisa
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development

  AlisaCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Core
    dependencies:
      - package: GRDB
      - package: ZIPFoundation
      - package: GCDWebServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.core
        SKIP_INSTALL: YES

  AlisaUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/UI
    dependencies:
      - target: AlisaCore
      - package: Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisa.ui
        SKIP_INSTALL: YES

  # Test targets removed for CI build simplicity